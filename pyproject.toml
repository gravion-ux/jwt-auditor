[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jwt-auditor"
version = "0.1.0"
description = "Defensive security auditor for JSON Web Tokens: alg=none, weak HMAC secrets, embedded keys, kid injection, lifetime and claim hygiene."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Priyanshu Kumar Thakur" },
]
maintainers = [
    { name = "Priyanshu Kumar Thakur", email = "gravion-ux@users.noreply.github.com" }
]
keywords = ["jwt", "json-web-token", "security", "red-team", "auditing", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Runtime dependencies: none. jwt-auditor uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4"]

[project.scripts]
jwt-auditor = "jwt_auditor.cli:main"

[project.urls]
Homepage = "https://github.com/gravion-ux/jwt-auditor"
Repository = "https://github.com/gravion-ux/jwt-auditor"
Issues = "https://github.com/gravion-ux/jwt-auditor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
